[project]
name = "receiptiq-backend"
version = "0.1.0"
description = "ReceiptIQ Backend API"
authors = [
    {name = "Admin", email = "admin@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "google-cloud-vision>=3.15.0",
    "google-genai>=2.16.0",
    "tenacity>=9.1.4",
    "passlib>=1.7.4",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "black>=24.4.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
